<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏎️ NEON DRIFT: NFS City Circuit</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #050510; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
}
canvas { display: block; border-radius: 8px; box-shadow: 0 0 40px rgba(0,200,255,0.2); }
.overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(5,5,16,0.95); display: flex; flex-direction: column;
  align-items: center; justify-content: center; z-index: 100;
}
.overlay.hidden { display: none; }
.title {
  font-size: 2.5em; font-weight: 900; letter-spacing: 3px;
  background: linear-gradient(90deg, #00f2ff, #ff00aa, #ffcc00);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-shadow: 0 0 30px rgba(0,242,255,0.5); margin-bottom: 15px; text-align: center;
}
.subtitle { color: #8892b0; margin-bottom: 25px; font-size: 1em; text-align: center; max-width: 400px; line-height: 1.5; }
.btn {
  padding: 12px 35px; font-size: 1.1em; font-weight: bold; border: none;
  border-radius: 8px; cursor: pointer; color: #fff;
  background: linear-gradient(135deg, #00f2ff, #0066ff);
  box-shadow: 0 4px 20px rgba(0,102,255,0.4); transition: transform 0.2s;
}
.btn:hover { transform: scale(1.05); }
.controls {
  margin-top: 20px; color: #667; font-size: 0.85em; line-height: 1.8; text-align: center;
}
kbd { background: #1a1a2e; padding: 3px 8px; border-radius: 4px; border: 1px solid #445; color: #00f2ff; font-weight: bold; }

.hud {
  position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 20px; z-index: 10; pointer-events: none; font-family: monospace;
}
.hud-item {
  background: rgba(0,0,0,0.6); border: 1px solid rgba(0,242,255,0.3);
  padding: 6px 14px; border-radius: 6px; color: #fff; text-align: center;
}
.hud-label { font-size: 0.65em; color: #88a; text-transform: uppercase; }
.hud-value { font-size: 1.4em; font-weight: bold; }
.speed-val { color: #00f2ff; }
.section-name { font-size: 0.7em; color: #ff00aa; text-transform: uppercase; letter-spacing: 2px; margin-top: 2px; }

.nitro-bar {
  position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
  width: 200px; height: 8px; background: rgba(0,0,0,0.5);
  border-radius: 4px; border: 1px solid #444; z-index: 10; overflow: hidden;
}
.nitro-fill {
  height: 100%; background: linear-gradient(90deg, #00f2ff, #ff00aa);
  transition: width 0.1s;
}

.minimap {
  position: fixed; top: 15px; right: 15px;
  border: 2px solid rgba(0,242,255,0.5);
  border-radius: 8px;
  background: rgba(5,5,16,0.8);
  box-shadow: 0 0 20px rgba(0,242,255,0.2);
  z-index: 10;
}

.arrow-indicator {
  position: fixed; top: 15%; left: 50%; transform: translate(-50%, -50%);
  font-size: 2.5em; z-index: 5; pointer-events: none; opacity: 0.8;
  text-shadow: 0 0 20px currentColor;
}

.section-banner {
  position: fixed; top: 35%; left: 50%; transform: translate(-50%, -50%);
  font-size: 2em; font-weight: 900; z-index: 20; pointer-events: none;
  text-shadow: 0 0 30px currentColor, 0 0 60px currentColor;
  opacity: 0; transition: opacity 0.3s;
  letter-spacing: 4px;
}
.section-banner.show { opacity: 1; }

.corner-warning {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  z-index: 15; pointer-events: none; font-size: 1.5em; font-weight: bold;
  color: #ff1744; text-shadow: 0 0 20px #ff1744;
  opacity: 0; transition: opacity 0.15s;
}
.corner-warning.show { opacity: 1; }
</style>
</head>
<body>

<canvas id="game"></canvas>
<canvas class="minimap" id="minimap" width="180" height="180"></canvas>
<div class="arrow-indicator" id="arrowIndicator">⬆️</div>
<div class="section-banner" id="sectionBanner"></div>
<div class="corner-warning" id="cornerWarning"></div>

<div class="hud">
  <div class="hud-item">
    <div class="hud-label">Speed</div>
    <div class="hud-value speed-val" id="speedDisplay">0</div>
    <div class="section-name" id="sectionName">START</div>
  </div>
  <div class="hud-item"><div class="hud-label">Lap</div><div class="hud-value" id="lapDisplay">1/2</div></div>
  <div class="hud-item"><div class="hud-label">Time</div><div class="hud-value" id="timeDisplay">0.00s</div></div>
</div>
<div class="nitro-bar"><div class="nitro-fill" id="nitroFill" style="width:100%"></div></div>

<div class="overlay" id="startScreen">
  <div class="title">🏎️ NEON DRIFT</div>
  <div class="subtitle">NFS City Circuit • 2 Lap • Lawan 3 AI!</div>
  <button class="btn" id="startBtn">🏁 MULAI BALAP</button>
  <div class="controls">
    <kbd>W</kbd>/<kbd>↑</kbd> Gas &nbsp; <kbd>S</kbd>/<kbd>↓</kbd> Rem<br>
    <kbd>A</kbd>/<kbd>D</kbd> atau <kbd>←</kbd>/<kbd>→</kbd> Belok<br>
    <kbd>SPACE</kbd> Nitro 🔥 &nbsp; <kbd>R</kbd> Restart
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const minimapCanvas = document.getElementById('minimap');
const minimapCtx = minimapCanvas.getContext('2d');
const startScreen = document.getElementById('startScreen');
const startBtn = document.getElementById('startBtn');
const speedDisplay = document.getElementById('speedDisplay');
const lapDisplay = document.getElementById('lapDisplay');
const timeDisplay = document.getElementById('timeDisplay');
const nitroFill = document.getElementById('nitroFill');
const arrowIndicator = document.getElementById('arrowIndicator');
const sectionBanner = document.getElementById('sectionBanner');
const sectionNameEl = document.getElementById('sectionName');
const cornerWarning = document.getElementById('cornerWarning');

function resize() {
  canvas.width = Math.min(window.innerWidth - 20, 1100);
  canvas.height = Math.min(window.innerHeight - 20, 650);
}
resize();
window.addEventListener('resize', resize);

// === CONSTANTS ===
const SEGMENT_LENGTH = 200;
const ROAD_WIDTH = 2000;
const DRAW_DISTANCE = 250;
const CAMERA_HEIGHT = 1000;
const CAMERA_DEPTH = 1 / Math.tan((75/2) * Math.PI/180);
const MAX_SPEED = SEGMENT_LENGTH * 50;
const ACCEL = MAX_SPEED / 5;
const BRAKE = -MAX_SPEED / 2;
const DECEL = -MAX_SPEED / 6;
const CENTRIFUGAL = 0.10;
const TRACK_LIMIT = 0.88;
const STEER_SENSITIVITY = 0.5;
const AUTO_CENTER = 0.04;
const CAMERA_SMOOTH = 0.08;
const TOTAL_LAPS = 2; // ✅ UBAH KE 2 LAP

// === NFS 1 CITY CIRCUIT TRACK LAYOUT ===
const NFS_TRACK = [
  { name: 'START STRAIGHT', length: 600, curve: 0, hill: 0, type: 'straight' },
  { name: 'RIGHT TURN', length: 300, curve: 0.0025, hill: 2, type: 'right90' },
  { name: 'LONG STRAIGHT', length: 500, curve: 0, hill: 0, type: 'straight' },
  { name: 'LEFT TURN', length: 300, curve: -0.0025, hill: 2, type: 'left90' },
  { name: 'MID STRAIGHT', length: 400, curve: 0, hill: 0, type: 'straight' },
  { name: 'RIGHT HAIRPIN', length: 250, curve: 0.0035, hill: 3, type: 'hairpin' },
  { name: 'BACK STRAIGHT', length: 500, curve: 0, hill: 0, type: 'straight' },
  { name: 'LEFT TURN', length: 300, curve: -0.0025, hill: 2, type: 'left90' },
  { name: 'FINISH LINE', length: 350, curve: 0, hill: 0, type: 'finish' },
];

// === STATE ===
let segments = [];
let player = { x: 0, z: 0, speed: 0, steer: 0, lap: 0, nitro: 100, nitroActive: false };
let aiCars = [];
let trackLen = 0;
let gameRunning = false;
let lapStartTime = 0;
let bestLap = null;
let keys = {};
let trackPoints = [];
let camera = { x: 0, targetX: 0, y: CAMERA_HEIGHT };
let currentSection = '';
let bannerTimer = 0;
let approachingCorner = false;
let cornerTimer = 0;

// === INPUT ===
document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(e.key)) e.preventDefault();
  if (e.key.toLowerCase() === 'r') startGame();
});
document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// === INIT AI ===
function initAI() {
  aiCars = [
    { z: 0, x: -0.3, speed: MAX_SPEED * 0.72, color: '#ff0055', lap: 0, name: 'VIPER', targetX: -0.3 },
    { z: 0, x: 0.3, speed: MAX_SPEED * 0.68, color: '#00ff88', lap: 0, name: 'COBRA', targetX: 0.3 },
    { z: 0, x: 0.0, speed: MAX_SPEED * 0.76, color: '#ffaa00', lap: 0, name: 'STING', targetX: 0.0 }
  ];
}

// === BUILD NFS TRACK ===
function buildRoad() {
  segments = [];
  trackPoints = [];
  let globalIdx = 0;
  
  for (const sec of NFS_TRACK) {
    for (let i = 0; i < sec.length; i++) {
      const pos = i / sec.length;
      let curveBase = sec.curve;
      
      if (sec.type === 'right90' || sec.type === 'left90') {
        if (pos < 0.15) curveBase = sec.curve * (pos / 0.15);
        else if (pos > 0.85) curveBase = sec.curve * ((1 - pos) / 0.15);
      } else if (sec.type === 'hairpin') {
        if (pos < 0.1) curveBase = sec.curve * (pos / 0.1);
        else if (pos > 0.9) curveBase = sec.curve * ((1 - pos) / 0.1);
      }
      
      let hillY = Math.sin(i * 0.01) * sec.hill * 5;
      
      segments.push({
        index: globalIdx,
        p: { world: { x: 0, y: hillY, z: globalIdx * SEGMENT_LENGTH }, screen: {}, camera: {} },
        curve: curveBase,
        color: Math.floor(globalIdx / 5) % 2,
        isFinish: sec.type === 'finish' && i >= sec.length - 15,
        section: sec.name,
        sectionType: sec.type,
        sectionProgress: pos
      });
      
      if (globalIdx % 8 === 0) trackPoints.push({ x: curveBase * 3000, z: globalIdx * SEGMENT_LENGTH, section: sec.name });
      globalIdx++;
    }
  }
  trackLen = segments.length * SEGMENT_LENGTH;
}

// === MATH ===
function project(p, camX, camY, camZ) {
  p.camera.x = p.world.x - camX;
  p.camera.y = p.world.y - camY;
  p.camera.z = p.world.z - camZ;
  if (p.camera.z <= 1) { p.screen.scale = 0; return false; }
  p.screen.scale = CAMERA_DEPTH / p.camera.z;
  p.screen.x = Math.round(canvas.width/2 + p.screen.scale * p.camera.x * canvas.width/2);
  p.screen.y = Math.round(canvas.height/2 - p.screen.scale * p.camera.y * canvas.height/2);
  p.screen.w = Math.round(p.screen.scale * ROAD_WIDTH * canvas.width/2);
  return true;
}

function findSegment(z) { return segments[Math.floor(z / SEGMENT_LENGTH) % segments.length]; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function getCurrentSection() { return (findSegment(player.z).section || 'START'); }

function showSectionBanner(name) {
  currentSection = name; sectionNameEl.textContent = name;
  sectionBanner.textContent = '🏎️ ' + name; sectionBanner.style.color = '#00f2ff';
  sectionBanner.classList.add('show'); bannerTimer = 100;
}

// === RENDER ===
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.55);
  g.addColorStop(0, '#050515'); g.addColorStop(0.5, '#0a0a2a'); g.addColorStop(1, '#150a2a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 50; i++) {
    const tw = (Math.sin(Date.now() * 0.002 + i * 2) + 1) * 0.5 + 0.5;
    ctx.globalAlpha = tw * 0.7;
    ctx.fillRect((i * 47) % canvas.width, (i * 31) % (canvas.height * 0.35), 2, 2);
  }
  ctx.globalAlpha = 1;
  drawNFSCitySkyline();
}

function drawNFSCitySkyline() {
  const bData = [
    [0.02,0.03,0.25,1],[0.06,0.02,0.18,0],[0.09,0.04,0.35,1],[0.14,0.02,0.22,0],
    [0.17,0.03,0.28,1],[0.22,0.02,0.15,0],[0.25,0.04,0.32,1],[0.30,0.03,0.20,0],
    [0.34,0.02,0.38,1],[0.38,0.04,0.26,1],[0.43,0.03,0.22,0],[0.47,0.02,0.30,1],
    [0.50,0.04,0.35,1],[0.55,0.03,0.18,0],[0.59,0.02,0.28,1],[0.62,0.04,0.24,0],
    [0.67,0.03,0.36,1],[0.71,0.02,0.20,0],[0.74,0.04,0.30,1],[0.79,0.03,0.22,1],
    [0.83,0.02,0.26,0],[0.86,0.04,0.34,1],[0.91,0.03,0.18,0],[0.95,0.04,0.30,1]
  ];
  for (const [bx,bw,bh,lights] of bData) {
    const x=bx*canvas.width, w=bw*canvas.width, h=bh*canvas.height, y=canvas.height*0.5-h;
    ctx.fillStyle='#0a0a18'; ctx.fillRect(x,y,w,h);
    if(lights) {
      for(let wx=x+4;wx<x+w-4;wx+=8) for(let wy=y+5;wy<y+h-5;wy+=8) {
        if(Math.random()>0.4) { ctx.globalAlpha=0.3+Math.random()*0.5; ctx.fillStyle=Math.random()>0.5?'#ffcc00':'#fff'; ctx.fillRect(wx,wy,3,3); }
      }
      ctx.globalAlpha=1;
    }
  }
}

function drawRoadSegment(s, p1, p2) {
  const neon = s.color ? '#00f2ff' : '#ff00aa';
  ctx.fillStyle = s.color ? '#060a06' : '#080a04';
  ctx.fillRect(0, p2.screen.y, canvas.width, p1.screen.y - p2.screen.y);
  
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.moveTo(p1.screen.x - p1.screen.w, p1.screen.y);
  ctx.lineTo(p1.screen.x + p1.screen.w, p1.screen.y);
  ctx.lineTo(p2.screen.x + p2.screen.w, p2.screen.y);
  ctx.lineTo(p2.screen.x - p2.screen.w, p2.screen.y);
  ctx.closePath(); ctx.fill();
  
  if (p1.screen.w > 30) {
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    for (let d = 0; d < 5; d++) {
      ctx.fillRect(p1.screen.x+(Math.random()-0.5)*p1.screen.w*1.5, p1.screen.y-Math.random()*(p1.screen.y-p2.screen.y), 1, 1);
    }
  }
  
  ctx.strokeStyle = neon; ctx.lineWidth = 4; ctx.shadowColor = neon; ctx.shadowBlur = 15;
  ctx.beginPath(); ctx.moveTo(p1.screen.x - p1.screen.w, p1.screen.y); ctx.lineTo(p2.screen.x - p2.screen.w, p2.screen.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(p1.screen.x + p1.screen.w, p1.screen.y); ctx.lineTo(p2.screen.x + p2.screen.w, p2.screen.y); ctx.stroke();
  ctx.shadowBlur = 0;
  
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2; ctx.setLineDash([30, 25]);
  ctx.beginPath(); ctx.moveTo(p1.screen.x - p1.screen.w/3, p1.screen.y); ctx.lineTo(p2.screen.x - p2.screen.w/3, p2.screen.y); ctx.stroke();
  ctx.setLineDash([]);
  
  ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1; ctx.setLineDash([20, 20]);
  ctx.beginPath(); ctx.moveTo(p1.screen.x, p1.screen.y); ctx.lineTo(p2.screen.x, p2.screen.y); ctx.stroke();
  ctx.setLineDash([]);
  
  if ((s.sectionType.includes('90') || s.sectionType==='hairpin') && s.sectionProgress < 0.1) {
    ctx.fillStyle = `rgba(255,255,0,${(1-s.sectionProgress/0.1)*0.6})`;
    ctx.fillRect(p1.screen.x - p1.screen.w, p1.screen.y - 2, p1.screen.w * 2, 3);
  }
  if (s.isFinish) {
    ctx.fillStyle = '#fff'; const cs=p1.screen.w/10;
    for(let i=0;i<20;i++) if(i%2) ctx.fillRect(p1.screen.x-p1.screen.w+i*cs, p1.screen.y, cs, p1.screen.y-p2.screen.y);
  }
}

function drawCarSprite(x, y, w, h, color) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(0, h*0.4, w*0.8, h*0.15, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(w*0.5, 0); ctx.lineTo(w*0.3, -h*0.3); ctx.lineTo(-w*0.3, -h*0.3); ctx.lineTo(-w*0.5, 0);
  ctx.lineTo(-w*0.4, h*0.5); ctx.lineTo(w*0.4, h*0.5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.moveTo(w*0.2, -h*0.2); ctx.lineTo(w*0.1, -h*0.45); ctx.lineTo(-w*0.1, -h*0.45); ctx.lineTo(-w*0.2, -h*0.2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#0ff'; ctx.fillRect(-w*0.15, -h*0.35, w*0.3, h*0.1);
  ctx.fillStyle = '#000';
  ctx.fillRect(-w*0.55, -h*0.1, w*0.15, h*0.25); ctx.fillRect(w*0.4, -h*0.1, w*0.15, h*0.25);
  ctx.restore();
}

function drawAI() {
  // Sort far to near for correct overlap
  aiCars.sort((a, b) => {
    let da = (a.z - player.z + trackLen) % trackLen;
    let db = (b.z - player.z + trackLen) % trackLen;
    return db - da;
  });

  for (const car of aiCars) {
    let relZ = (car.z - player.z + trackLen) % trackLen;
    if (relZ > DRAW_DISTANCE * SEGMENT_LENGTH || relZ < 10) continue;

    const seg = findSegment(car.z);
    const scale = CAMERA_DEPTH / relZ;
    const screenX = canvas.width/2 + scale * (car.x * ROAD_WIDTH - camera.x) * canvas.width/2;
    const screenY = canvas.height/2 - scale * (seg.p.world.y - CAMERA_HEIGHT) * canvas.height/2;
    const spriteW = scale * ROAD_WIDTH * 0.12 * canvas.width/2;
    const spriteH = spriteW * 0.65;

    if (screenY < -50 || screenY > canvas.height + 50 || spriteW < 3) continue;
    drawCarSprite(screenX, screenY, spriteW, spriteH, car.color);
  }
}

function drawPlayer() {
  const bounce = Math.sin(Date.now() * 0.015) * 2;
  const lean = player.steer * 0.1;
  const flame = player.nitroActive ? 15 + Math.random() * 12 : 0;
  
  ctx.save();
  ctx.translate(canvas.width/2 + player.steer * 15, canvas.height - 120 + bounce);
  ctx.rotate(lean);
  
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(0, 35, 55, 12, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#0044cc';
  ctx.beginPath();
  ctx.moveTo(60, 0); ctx.lineTo(42, -16); ctx.lineTo(-42, -16); ctx.lineTo(-60, 0);
  ctx.lineTo(-50, 25); ctx.lineTo(50, 25); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#002288';
  ctx.beginPath();
  ctx.moveTo(22, -10); ctx.lineTo(10, -26); ctx.lineTo(-10, -26); ctx.lineTo(-22, -10);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#00f2ff';
  ctx.beginPath();
  ctx.moveTo(16, -12); ctx.lineTo(6, -22); ctx.lineTo(-6, -22); ctx.lineTo(-16, -12);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#00f2ff'; ctx.lineWidth = 3; ctx.shadowColor = '#00f2ff'; ctx.shadowBlur = 15;
  ctx.beginPath(); ctx.moveTo(-45, 6); ctx.lineTo(-32, 26); ctx.lineTo(32, 26); ctx.lineTo(45, 6);
  ctx.stroke(); ctx.shadowBlur = 0;
  ctx.fillStyle = '#111'; ctx.fillRect(-55, 3, 10, 20); ctx.fillRect(45, 3, 10, 20);
  ctx.fillStyle = '#fff9c4'; ctx.shadowColor = '#ffeb3b'; ctx.shadowBlur = 6;
  ctx.fillRect(54, -9, 6, 4); ctx.fillRect(54, 3, 6, 4);
  ctx.fillStyle = keys['s'] || keys['arrowdown'] ? '#ff0000' : '#aa0000';
  ctx.shadowColor = '#ff0000'; ctx.shadowBlur = keys['s'] ? 10 : 3;
  ctx.fillRect(-60, -7, 8, 3); ctx.fillRect(-60, 7, 8, 3); ctx.shadowBlur = 0;
  if (flame > 0) {
    ctx.fillStyle = '#00e5ff'; ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 15;
    ctx.beginPath(); ctx.moveTo(-12, 24); ctx.lineTo(0, 24 + flame * 1.2); ctx.lineTo(12, 24); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(-6, 24); ctx.lineTo(0, 24 + flame * 0.6); ctx.lineTo(6, 24); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function drawSpeedLines() {
  const sp = player.speed / MAX_SPEED;
  if (sp < 0.3) return;
  const intensity = (sp - 0.3) * 2;
  ctx.strokeStyle = `rgba(255,255,255,${intensity * 0.2})`; ctx.lineWidth = 2;
  for (let i = 0; i < Math.floor(intensity * 8); i++) {
    const a = Math.random() * Math.PI * 2, l = 15 + Math.random() * 30;
    const x1 = canvas.width/2 + Math.cos(a)*(60+Math.random()*150), y1 = canvas.height/2 + Math.sin(a)*(40+Math.random()*100);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x1-Math.cos(a)*l, y1-Math.sin(a)*l); ctx.stroke();
  }
}

function drawMinimap() {
  const mw = minimapCanvas.width, mh = minimapCanvas.height, scale = 0.028;
  minimapCtx.fillStyle = 'rgba(5,5,16,0.9)'; minimapCtx.fillRect(0,0,mw,mh);
  const cx=mw/2, cz=mh/2;
  
  minimapCtx.strokeStyle='#333'; minimapCtx.lineWidth=7; minimapCtx.beginPath();
  let mx=cx, mz=cz, acc=0;
  for(let i=0;i<segments.length;i+=20){
    acc+=segments[i].curve*50; mx+=acc; mz+=3;
    if(i===0) minimapCtx.moveTo(mx,mz); else minimapCtx.lineTo(mx,mz);
  } minimapCtx.stroke();
  minimapCtx.strokeStyle='rgba(0,242,255,0.3)'; minimapCtx.lineWidth=11; minimapCtx.stroke();
  
  // AI dots
  for(const car of aiCars){
    let relZ=(car.z-player.z+trackLen)%trackLen;
    if(relZ>DRAW_DISTANCE*SEGMENT_LENGTH) continue;
    const carSeg=findSegment(car.z);
    const cs= CAMERA_DEPTH/relZ;
    const sx= cx + (car.x*ROAD_WIDTH - camera.x)*cs*mw/2;
    const sy= cz + (carSeg.p.world.y-CAMERA_HEIGHT)*cs*mh/2*0.1;
    minimapCtx.fillStyle=car.color;
    minimapCtx.beginPath(); minimapCtx.arc(sx, sy, 3, 0, Math.PI*2); minimapCtx.fill();
  }
  
  // Player dot
  const pSeg=findSegment(player.z);
  const ps= CAMERA_DEPTH/10; // relative close
  const px= cx + (player.x*ROAD_WIDTH - camera.x)*ps*mw/2;
  const py= cz + (pSeg.p.world.y-CAMERA_HEIGHT)*ps*mh/2*0.1;
  minimapCtx.fillStyle='#00f2ff'; minimapCtx.shadowColor='#00f2ff'; minimapCtx.shadowBlur=6;
  minimapCtx.beginPath(); minimapCtx.arc(px, py, 4, 0, Math.PI*2); minimapCtx.fill();
  minimapCtx.shadowBlur=0;
}

function updateArrowIndicator() {
  const seg=findSegment(player.z), curve=seg.curve;
  let arrow='⬆️';
  if(curve<-0.0015) arrow='↖️'; else if(curve<-0.0004) arrow='⬅️';
  else if(curve>0.0015) arrow='↗️'; else if(curve>0.0004) arrow='➡️';
  arrowIndicator.textContent=arrow;
  arrowIndicator.style.color=Math.abs(curve)>0.001?'#ff1744':'#00f2ff';
  arrowIndicator.style.opacity=0.6+Math.abs(curve)*150;
}

function updateHUD() {
  speedDisplay.textContent = Math.round(player.speed/MAX_SPEED*300);
  lapDisplay.textContent = `${Math.min(player.lap+1, TOTAL_LAPS)}/${TOTAL_LAPS}`;
  const t=((Date.now()-lapStartTime)/1000).toFixed(2);
  timeDisplay.textContent = player.lap>=TOTAL_LAPS ? (bestLap?.toFixed(2)+'s'||'0.00s') : t+'s';
  nitroFill.style.width=player.nitro+'%';
}

// === UPDATE AI ===
function updateAI(dt) {
  for(const car of aiCars) {
    // Speed variation
    car.speed += (Math.random()-0.5)*MAX_SPEED*0.08*dt;
    car.speed = clamp(car.speed, MAX_SPEED*0.55, MAX_SPEED*0.82);
    
    // Move
    car.z += car.speed * dt;
    if(car.z >= trackLen) { car.z -= trackLen; car.lap++; }
    
    // Track following
    const seg = findSegment(car.z);
    car.x -= seg.curve * 45 * dt; // Counter centrifugal
    car.x += (car.targetX - car.x) * 0.015; // Return to lane
    car.x = clamp(car.x, -TRACK_LIMIT+0.05, TRACK_LIMIT-0.05);
    
    // Random lane change occasionally
    if(Math.random()<0.002) car.targetX = (Math.random()-0.5)*1.4;
  }
}

// === MAIN UPDATE ===
function update(dt) {
  const seg = findSegment(player.z);
  const speedPercent = player.speed / MAX_SPEED;
  
  if(keys['w']||keys['arrowup']) player.speed+=ACCEL*dt;
  else if(keys['s']||keys['arrowdown']) player.speed+=BRAKE*dt;
  else player.speed+=DECEL*dt;
  
  if(keys['a']||keys['arrowleft']) player.steer=-1;
  else if(keys['d']||keys['arrowright']) player.steer=1;
  else player.steer=0;
  
  player.x += player.steer*STEER_SENSITIVITY*dt*1.8*speedPercent;
  player.x -= speedPercent*seg.curve*CENTRIFUGAL*dt*40;
  if(player.steer===0) player.x*=(1-AUTO_CENTER);
  
  if(keys[' ']&&player.nitro>0&&(keys['w']||keys['arrowup'])) {
    player.nitroActive=true; player.nitro=Math.max(0,player.nitro-20*dt);
    player.speed=Math.min(MAX_SPEED*1.15, player.speed+MAX_SPEED*0.25*dt);
  } else { player.nitro=Math.min(100,player.nitro+7*dt); player.nitroActive=false; }
  
  if(player.x>TRACK_LIMIT) { player.x=TRACK_LIMIT-(TRACK_LIMIT-player.x)*0.3; player.speed*=0.97; }
  else if(player.x<-TRACK_LIMIT) { player.x=-TRACK_LIMIT-(-TRACK_LIMIT-player.x)*0.3; player.speed*=0.97; }
  player.speed=clamp(player.speed,0,MAX_SPEED*1.15);
  
  const isCorner=seg.sectionType.includes('90')||seg.sectionType==='hairpin';
  if(isCorner && seg.sectionProgress<0.15 && speedPercent>0.5) {
    cornerTimer=40;
    cornerWarning.textContent=`⚠️ ${seg.curve>0?'↗️':'↖️'} CORNER AHEAD!`;
    cornerWarning.style.color=speedPercent>0.7?'#ff1744':'#ffd600';
  }
  if(cornerTimer>0){ cornerTimer--; cornerWarning.classList.add('show'); }
  else cornerWarning.classList.remove('show');
  
  player.z += player.speed*dt;
  const newSection=getCurrentSection();
  if(newSection!==currentSection) showSectionBanner(newSection);
  if(bannerTimer>0){ bannerTimer--; if(bannerTimer<=0) sectionBanner.classList.remove('show'); }
  
  if(player.z>=trackLen) {
    player.z-=trackLen; player.lap++;
    const lapTime=(Date.now()-lapStartTime)/1000;
    if(player.lap<=TOTAL_LAPS && (!bestLap||lapTime<bestLap)) bestLap=lapTime;
    lapStartTime=Date.now();
    
    if(player.lap>=TOTAL_LAPS) {
      gameRunning=false;
      startScreen.classList.remove('hidden');
      document.querySelector('.title').textContent='🏆 FINISH!';
      document.querySelector('.subtitle').textContent=`Best Lap: ${bestLap?.toFixed(2)||'0.00'}s | 2/2 Laps Done!`;
      startBtn.textContent='🔄 BALAP LAGI';
    }
  }
  
  camera.targetX=player.x*ROAD_WIDTH;
  camera.x+=(camera.targetX-camera.x)*CAMERA_SMOOTH;
  
  updateAI(dt);
  updateHUD(); updateArrowIndicator(); drawMinimap();
}

// === RENDER LOOP ===
function render() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawSky();
  
  const baseIdx=Math.floor(player.z/SEGMENT_LENGTH);
  let maxY=canvas.height, camX=camera.x, curveAcc=0;
  
  for(let n=0;n<DRAW_DISTANCE;n++) {
    const idx=baseIdx+n; if(idx>=segments.length) break;
    const seg=segments[idx];
    curveAcc+=seg.curve;
    camX+=curveAcc*SEGMENT_LENGTH;
    if(!project(seg.p,camX,camera.y,player.z)) continue;
    if(seg.p.screen.y>=maxY||seg.p.screen.scale<=0) continue;
    
    const nextIdx=idx+1; if(nextIdx>=segments.length) break;
    const next=segments[nextIdx];
    let nextCamX=camX+(curveAcc+next.curve)*SEGMENT_LENGTH;
    project(next.p,nextCamX,camera.y,player.z);
    drawRoadSegment(seg,seg.p,next.p);
    maxY=seg.p.screen.y;
  }
  
  drawAI();
  drawSpeedLines();
  drawPlayer();
}

let last=0;
function loop(ts) {
  const dt=Math.min((ts-last)/1000,0.05); last=ts;
  if(gameRunning) update(dt);
  render(); requestAnimationFrame(loop);
}

function startGame() {
  player.x=0; player.z=0; player.speed=0; player.steer=0;
  player.lap=0; player.nitro=100; player.nitroActive=false;
  camera.x=0; camera.targetX=0;
  gameRunning=true; lapStartTime=Date.now(); bestLap=null; currentSection='';
  buildRoad(); initAI();
  startScreen.classList.add('hidden');
}

startBtn.addEventListener('click', startGame);
buildRoad(); initAI();
requestAnimationFrame(loop);
</script>
</body>
