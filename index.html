<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selju Island: Mutiara Manggara - Episode 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
        }
        
        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        
        /* UI OVERLAY */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        /* DIALOGUE BOX */
        #dialogue-box {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1000px;
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #FFD700;
            border-radius: 15px;
            padding: 25px;
            color: white;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        
        #speaker-name {
            font-size: 28px;
            font-weight: bold;
            color: #FFD700;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        
        #dialogue-text {
            font-size: 20px;
            line-height: 1.8;
            min-height: 60px;
        }
        
        #next-indicator {
            position: absolute;
            bottom: 20px;
            right: 30px;
            animation: bounce 1s infinite;
            font-size: 30px;
            color: #FFD700;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        /* CHARACTER SPRITE */
        #character-sprite {
            position: absolute;
            bottom: 250px;
            left: 50%;
            transform: translateX(-50%);
            height: 400px;
            transition: all 0.5s ease;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }
        
        /* CHOICE MENU */
        #choices {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            gap: 15px;
            pointer-events: auto;
        }
        
        .choice-btn {
            padding: 20px 40px;
            font-size: 20px;
            background: linear-gradient(135deg, #2E8B57 0%, #3CB371 100%);
            color: white;
            border: 2px solid #FFD700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 400px;
            text-align: center;
        }
        
        .choice-btn:hover {
            background: linear-gradient(135deg, #3CB371 0%, #2E8B57 100%);
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(60, 179, 113, 0.6);
        }
        
        /* TITLE SCREEN */
        #title-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.8)), 
                        url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"><rect fill="%2387CEEB" width="1200" height="600"/><path fill="%23228B22" d="M0 400 Q300 350 600 400 T1200 400 L1200 600 L0 600 Z"/></svg>');
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 1000;
        }
        
        #title-screen h1 {
            font-size: 72px;
            color: #FFD700;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            margin-bottom: 20px;
            text-align: center;
        }
        
        #title-screen h2 {
            font-size: 32px;
            margin-bottom: 50px;
            text-align: center;
        }
        
        #start-btn {
            padding: 20px 60px;
            font-size: 24px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        #start-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.6);
        }
        
        /* SCENE INDICATOR */
        #scene-indicator {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 10px;
            color: #FFD700;
            font-size: 16px;
        }
        
        /* SKIP BUTTON */
        #skip-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(255,215,0,0.9);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="canvas-container"></div>
        
        <div id="ui-layer">
            <div id="scene-indicator">Episode 1: Kejatuhan Selju</div>
            <button id="skip-btn" onclick="skipScene()">Skip Cutscene</button>
            
            <div id="character-sprite"></div>
            
            <div id="choices">
                <button class="choice-btn" onclick="makeChoice(0)">Pilihan 1</button>
                <button class="choice-btn" onclick="makeChoice(1)">Pilihan 2</button>
            </div>
            
            <div id="dialogue-box" onclick="nextDialogue()" style="display: none;">
                <div id="speaker-name">Narator</div>
                <div id="dialogue-text">Teks dialog akan muncul di sini...</div>
                <div id="next-indicator">▼</div>
            </div>
        </div>
    </div>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // === THREE.JS SETUP ===
        let scene, camera, renderer, island, temple, ocean;
        let currentScene = 0;
        let isCutscene = true;
        let animationId;
        
        function initThreeJS() {
            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x87CEEB, 10, 100);
            
            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 15);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const sunLight = new THREE.DirectionalLight(0xFFD700, 1);
            sunLight.position.set(10, 20, 10);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);
            
            createEnvironment();
            animate();
        }
        
        function createEnvironment() {
            // OCEAN
            const oceanGeometry = new THREE.PlaneGeometry(200, 200, 50, 50);
            const oceanMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x0077BE,
                transparent: true,
                opacity: 0.8,
                roughness: 0.2,
                metalness: 0.1
            });
            ocean = new THREE.Mesh(oceanGeometry, oceanMaterial);
            ocean.rotation.x = -Math.PI / 2;
            ocean.position.y = -2;
            scene.add(ocean);
            
            // ISLAND (Beach)
            const islandGeometry = new THREE.CircleGeometry(30, 32);
            const islandMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xF4D03F,
                roughness: 0.9
            });
            island = new THREE.Mesh(islandGeometry, islandMaterial);
            island.rotation.x = -Math.PI / 2;
            island.position.y = -1.9;
            island.receiveShadow = true;
            scene.add(island);
            
            // TEMPLE (Simple structure)
            createTemple();
            
            // PALM TREES
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const radius = 20;
                createPalmTree(
                    Math.cos(angle) * radius,
                    Math.sin(angle) * radius
                );
            }
            
            // SKY GRADIENT
            scene.background = new THREE.Color(0x87CEEB);
        }
        
        function createTemple() {
            const templeGroup = new THREE.Group();
            
            // Base
            const baseGeometry = new THREE.CylinderGeometry(4, 5, 2, 8);
            const baseMaterial = new THREE.MeshStandardMaterial({ color: 0x8B7355 });
            const base = new THREE.Mesh(baseGeometry, baseMaterial);
            base.position.y = 1;
            base.castShadow = true;
            templeGroup.add(base);
            
            // Pillars
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const pillarGeometry = new THREE.CylinderGeometry(0.3, 0.3, 4, 8);
                const pillarMaterial = new THREE.MeshStandardMaterial({ color: 0xD2691E });
                const pillar = new THREE.Mesh(pillarGeometry, pillarMaterial);
                pillar.position.set(
                    Math.cos(angle) * 3,
                    3,
                    Math.sin(angle) * 3
                );
                pillar.castShadow = true;
                templeGroup.add(pillar);
            }
            
            // Roof
            const roofGeometry = new THREE.ConeGeometry(5, 3, 8);
            const roofMaterial = new THREE.MeshStandardMaterial({ color: 0x8B0000 });
            const roof = new THREE.Mesh(roofGeometry, roofMaterial);
            roof.position.y = 5;
            roof.castShadow = true;
            templeGroup.add(roof);
            
            // Pearl (Glowing orb)
            const pearlGeometry = new THREE.SphereGeometry(0.5, 32, 32);
            const pearlMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xFFD700,
                emissive: 0xFFD700,
                emissiveIntensity: 2,
                transparent: true,
                opacity: 0.9
            });
            const pearl = new THREE.Mesh(pearlGeometry, pearlMaterial);
            pearl.position.y = 6;
            
            // Pearl glow light
            const pearlLight = new THREE.PointLight(0xFFD700, 2, 10);
            pearlLight.position.y = 6;
            templeGroup.add(pearlLight);
            
            templeGroup.add(pearl);
            templeGroup.position.set(0, -1, 0);
            scene.add(templeGroup);
            
            temple = templeGroup;
        }
        
        function createPalmTree(x, z) {
            const treeGroup = new THREE.Group();
            
            // Trunk
            const trunkGeometry = new THREE.CylinderGeometry(0.3, 0.4, 6, 8);
            const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
            trunk.position.y = 3;
            trunk.castShadow = true;
            treeGroup.add(trunk);
            
            // Leaves
            const leavesGeometry = new THREE.ConeGeometry(2, 3, 8);
            const leavesMaterial = new THREE.MeshStandardMaterial({ color: 0x228B22 });
            const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
            leaves.position.y = 6.5;
            treeGroup.add(leaves);
            
            treeGroup.position.set(x, -1.9, z);
            scene.add(treeGroup);
        }
        
        function animate() {
            animationId = requestAnimationFrame(animate);
            
            // Animate ocean waves
            if (ocean) {
                const time = Date.now() * 0.001;
                const positions = ocean.geometry.attributes.position.array;
                for (let i = 0; i < positions.length; i += 3) {
                    positions[i + 2] = Math.sin(time + positions[i] * 0.1) * 0.5;
                }
                ocean.geometry.attributes.position.needsUpdate = true;
            }
            
            // Animate pearl glow
            if (temple) {
                const pearl = temple.children.find(c => c.geometry && c.geometry.type === 'SphereGeometry');
                if (pearl) {
                    pearl.scale.setScalar(1 + Math.sin(Date.now() * 0.003) * 0.1);
                }
            }
            
            renderer.render(scene, camera);
        }
        
        // === STORY & DIALOGUE SYSTEM ===
        const story = [
            // PROLOGUE
            {
                type: 'cutscene',
                speaker: 'Narator',
                text: 'Selju Island pernah menjadi permata Nusantara. Laut biru kristal, hutan hijau subur, nelayan tersenyum, anak-anak bermain...',
                character: null,
                background: 'sunny',
                camera: { x: 0, y: 8, z: 20 }
            },
            {
                type: 'cutscene',
                speaker: 'Narator',
                text: 'Di puncak pulau, Mutiara Manggara bercahaya terang, dijaga dalam kuil suci. Empat elemen hidup dalam harmoni.',
                character: null,
                camera: { x: 0, y: 10, z: 10 }
            },
            {
                type: 'cutscene',
                speaker: 'Narator',
                text: 'Namun, kedamaian itu hancur ketika Lekok, seorang pemuda ambisius, menyusup ke kuil...',
                character: null,
                camera: { x: 0, y: 6, z: 8 }
            },
            {
                type: 'dialogue',
                speaker: 'Lekok',
                text: '"Maafkan aku... tapi aku akan menyelamatkan kita semua."',
                character: 'lekok',
                emotion: 'determined'
            },
            {
                type: 'cutscene',
                speaker: 'Narator',
                text: 'Dengan mantra yang dipelajari diam-diam, Lekok mengambil mutiara dari altar suci.',
                character: null,
                effect: 'pearl_taken'
            },
            {
                type: 'cutscene',
                speaker: 'Narator',
                text: 'Cahaya pulau meredup. Laut berubah gelap. Pohon layu dalam hitungan detik. Ikan-ikan mati terdampar.',
                character: null,
                background: 'cursed',
                effect: 'island_cursed'
            },
            {
                type: 'dialogue',
                speaker: 'Narator',
                text: '5 TAHUN KEMUDIAN...',
                character: null,
                background: 'dark'
            },
            // ACT I
            {
                type: 'dialogue',
                speaker: 'Narator',
                text: 'Selju Island kini bayangan dari dirinya dulu. Pantai berpasir abu-abu, perahu terbengkalai, nelayan menganggur.',
                character: null,
                background: 'wasteland'
            },
            {
                type: 'dialogue',
                speaker: 'Aga',
                text: 'Sudah 5 tahun... Aku masih mengingat kejayaan pulau ini. Ibu dan ayah kehilangan mata pencaharian. Tetangga sakit karena air tercemar.',
                character: 'aga',
                emotion: 'sad'
            },
            {
                type: 'dialogue',
                speaker: 'Narator',
                text: 'Aga (17 tahun) sering duduk di tebing memandang laut yang mati, bermimpi mengembalikan kejayaan pulau.',
                character: 'aga',
                emotion: 'contemplative'
            },
            {
                type: 'dialogue',
                speaker: 'Liu Liu',
                text: 'Aga! Aku menemukan sesuatu! Catatan kuno milik leluhur!',
                character: 'liu_liu',
                emotion: 'excited'
            },
            {
                type: 'dialogue',
                speaker: 'Aga',
                text: 'Liu Liu? Ada apa dengan catatan itu?',
                character: 'aga',
                emotion: 'curious'
            },
            {
                type: 'dialogue',
                speaker: 'Liu Liu',
                text: 'Mutiara Manggara masih ada! Lekok menyembunyikannya di empat lokasi tersembunyi. Ia memecah kekuatannya!',
                character: 'liu_liu',
                emotion: 'serious'
            },
            {
                type: 'dialogue',
                speaker: 'Aga',
                text: 'Empat lokasi? Maksudnya...',
                character: 'aga',
                emotion: 'confused'
            },
            {
                type: 'dialogue',
                speaker: 'Liu Liu',
                text: 'Manggata (Tanah), Manggair (Air), Manggadara (Udara), dan Manggapi (Api). Kita harus mengumpulkannya sebelum Lekok menyatukannya untuk kekuatan abadi!',
                character: 'liu_liu',
                emotion: 'determined'
            },
            {
                type: 'dialogue',
                speaker: 'Narator',
                text: 'Dampar dan Kakin bergabung dalam perjalanan ini.',
                character: null
            },
            {
                type: 'dialogue',
                speaker: 'Dampar',
                text: 'Aku kenal laut ini seperti telapak tanganku sendiri. Aku akan membantu melacak jejak Lekok!',
                character: 'dampar',
                emotion: 'brave'
            },
            {
                type: 'dialogue',
                speaker: 'Kakin',
                text: 'Ini petualangan terbesar kita! Aku siap memanjat tebing, menyusup goa, apapun itu!',
                character: 'kakin',
                emotion: 'excited'
            },
            {
                type: 'dialogue',
                speaker: 'Aga',
                text: 'Terima kasih, teman-teman. Bersama-sama, kita akan mengembalikan kejayaan Selju Island!',
                character: 'aga',
                emotion: 'determined'
            },
            {
                type: 'dialogue',
                speaker: 'Narator',
                text: 'Mereka mencari Arong, roh penjaga yang masih tersisa. Di gua kuno, Arong muncul...',
                character: null
            },
            {
                type: 'dialogue',
                speaker: 'Arong',
                text: 'Mutiara Manggara telah terpecah menjadi empat elemen. Untuk mengembalikannya, kalian harus melewati empat ujian.',
                character: 'arong',
                emotion: 'wise'
            },
            {
                type: 'dialogue',
                speaker: 'Arong',
                text: 'Tapi ingat: setiap mutiara meminta harga. Apakah kalian siap berkorban untuk pulau ini?',
                character: 'arong',
                emotion: 'serious'
            },
            {
                type: 'choice',
                speaker: '',
                text: 'Apa keputusanmu?',
                choices: [
                    'Kami siap! Selju Island adalah rumah kami!',
                    'Apa harga yang harus kami bayar?',
                    'Kami tidak punya pilihan. Ini satu-satunya jalan.'
                ]
            },
            {
                type: 'dialogue',
                speaker: 'Aga',
                text: 'Kami siap! Apapun harganya, kami akan mengembalikan keseimbangan alam!',
                character: 'aga',
                emotion: 'determined'
            },
            {
                type: 'dialogue',
                speaker: 'Arong',
                text: 'Baiklah. Perjalanan kalian dimulai dari Hutan Mati di utara. Carilah Manggata, Mutiara Tanah.',
                character: 'arong',
                emotion: 'wise'
            },
            {
                type: 'dialogue',
                speaker: 'Narator',
                text: 'Dan demikianlah, petualangan Aga dan teman-teman dimulai. Empat mutiara, empat ujian, satu tujuan: menyelamatkan Selju Island.',
                character: null
            },
            {
                type: 'ending',
                speaker: '',
                text: 'Episode 1: Selesai\n\nEpisode 2: Manggata - Mutiara Tanah\nSegera Hadir...',
                character: null
            }
        ];
        
        // === CHARACTER IMAGES (Base64 placeholder - ganti dengan gambar kamu) ===
        const characterImages = {
            'aga': 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400"><rect fill="%238B4513" width="200" height="400"/><circle fill="%23FDB" cx="100" cy="80" r="50"/><text x="100" y="250" font-size="20" fill="white" text-anchor="middle">AGA</text></svg>',
            'liu_liu': 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400"><rect fill="%232E8B57" width="200" height="400"/><circle fill="%23FDB" cx="100" cy="80" r="50"/><text x="100" y="250" font-size="20" fill="white" text-anchor="middle">LIU LIU</text></svg>',
            'dampar': 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400"><rect fill="%234169E1" width="200" height="400"/><circle fill="%23FDB" cx="100" cy="80" r="50"/><text x="100" y="250" font-size="20" fill="white" text-anchor="middle">DAMPAR</text></svg>',
            'kakin': 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400"><rect fill="%23FF6347" width="200" height="400"/><circle fill="%23FDB" cx="100" cy="80" r="50"/><text x="100" y="250" font-size="20" fill="white" text-anchor="middle">KAKIN</text></svg>',
            'arong': 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400"><rect fill="%234B0082" width="200" height="400"/><circle fill="%23DDD" cx="100" cy="80" r="50"/><text x="100" y="250" font-size="20" fill="white" text-anchor="middle">ARONG</text></svg>',
            'lekok': 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400"><rect fill="%232F4F4F" width="200" height="400"/><circle fill="%23FDB" cx="100" cy="80" r="50"/><text x="100" y="250" font-size="20" fill="white" text-anchor="middle">LEKOK</text></svg>'
        };
        
        // === DIALOGUE SYSTEM ===
        function nextDialogue() {
            if (currentScene >= story.length) return;
            
            const scene = story[currentScene];
            
            // Update dialogue box
            document.getElementById('speaker-name').textContent = scene.speaker;
            document.getElementById('dialogue-text').textContent = scene.text;
            document.getElementById('dialogue-box').style.display = 'block';
            
            // Update character sprite
            if (scene.character) {
                const spriteDiv = document.getElementById('character-sprite');
                spriteDiv.innerHTML = `<img src="${characterImages[scene.character]}" style="height: 100%; width: auto;">`;
                spriteDiv.style.display = 'block';
            } else {
                document.getElementById('character-sprite').style.display = 'none';
            }
            
            // Update camera for cutscenes
            if (scene.camera && camera) {
                camera.position.x = scene.camera.x;
                camera.position.y = scene.camera.y;
                camera.position.z = scene.camera.z;
                camera.lookAt(0, 3, 0);
            }
            
            // Handle effects
            if (scene.effect === 'island_cursed') {
                scene.background = new THREE.Color(0x2F4F4F);
                ocean.material.color.setHex(0x1a1a2e);
                island.material.color.setHex(0x4a4a4a);
            }
            
            // Show choices if needed
            if (scene.type === 'choice') {
                showChoices(scene.choices);
            }
            
            currentScene++;
        }
        
        function showChoices(choices) {
            const choicesDiv = document.getElementById('choices');
            choicesDiv.innerHTML = '';
            choicesDiv.style.display = 'flex';
            
            choices.forEach((choice, index) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = choice;
                btn.onclick = () => makeChoice(index);
                choicesDiv.appendChild(btn);
            });
            
            document.getElementById('dialogue-box').style.pointerEvents = 'none';
        }
        
        function makeChoice(choiceIndex) {
            document.getElementById('choices').style.display = 'none';
            document.getElementById('dialogue-box').style.pointerEvents = 'auto';
            
            // Logika pilihan (bisa dikembangkan)
            const responses = [
                'Semangat! Kita pasti bisa!',
                'Kita harus berhati-hati...',
                'Mari kita lakukan ini bersama.'
            ];
            
            console.log('Choice:', responses[choiceIndex]);
            nextDialogue();
        }
        
        function skipScene() {
            currentScene = story.length;
            document.getElementById('dialogue-box').style.display = 'none';
            document.getElementById('character-sprite').style.display = 'none';
            document.getElementById('choices').style.display = 'none';
        }
        
        // === START GAME ===
        function startGame() {
            document.getElementById('title-screen').style.display = 'none';
            initThreeJS();
            setTimeout(() => {
                nextDialogue();
            }, 1000);
        }
        
        // Window resize handler
        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
